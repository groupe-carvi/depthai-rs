name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / DepthAI-Core ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        sdk: [v3-1-0, v3-4-0, v3-8-0, v3-10-0]

    env:
      DEPTHAI_RS_CACHE_DIR: ${{ github.workspace }}/.depthai-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/archives

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev \
            cmake ninja-build pkg-config \
            python3 \
            autoconf automake autoconf-archive libtool \
            libudev-dev libssl-dev \
            nasm \
            libdw-dev libelf-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fingerprint native toolchain
        if: runner.os == 'Linux'
        id: native-toolchain
        shell: bash
        run: |
          fingerprint=$(
            {
              cat /etc/os-release
              gcc --version
              g++ --version
              clang-18 --version
              cmake --version
              ninja --version
              dpkg-query -W libc6-dev libudev-dev libssl-dev libdw-dev libelf-dev
            } | sha256sum | cut -d ' ' -f 1
          )
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Cache compiled DepthAI-Core
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          # Keep headers, generated files and transitive libraries with the core library.
          # Exact matches only: build.rs reuses native libraries without rebuilding them.
          path: ${{ env.DEPTHAI_RS_CACHE_DIR }}
          key: depthai-core-v2-${{ matrix.os }}-${{ matrix.sdk }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.fingerprint }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'depthai-sys/Cargo.toml', 'depthai-sys/build.rs', 'depthai-sys/src/cache_layout.rs', '.github/workflows/ci.yml') }}

      - name: Prepare vcpkg cache directories
        shell: bash
        run: |
          mkdir -p "${VCPKG_DOWNLOADS}" "${VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Cache vcpkg downloads and binary archives
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache/downloads
            .vcpkg-cache/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('depthai-sys/build.rs') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Native outputs outside target/ are cached separately above.
          cache-on-failure: true
          shared-key: ${{ matrix.sdk }}

      - name: Configure Linux clang
        if: runner.os == 'Linux'
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Configure Windows clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build (workspace)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 80
          max_attempts: 2
          command: cargo check --workspace --all-targets --locked --features ${{ matrix.sdk }}

      - name: Test (workspace)
        run: cargo test --workspace --all-targets --locked --features ${{ matrix.sdk }}

      - name: Compile hardware qualification tests (no hardware on CI)
        run: cargo test --features hit,${{ matrix.sdk }} --no-run --locked

      - name: Build documentation for both crates
        run: cargo doc -p depthai -p depthai-sys --no-deps --locked --features ${{ matrix.sdk }}

  doc:
    name: Documentation (docs.rs)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev

      - name: Set up Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-docs-rs
        uses: dtolnay/install@cargo-docs-rs

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Run cargo rustdoc with the same options that would be used by docs.rs,
      # taking into account package.metadata.docs.rs configured in Cargo.toml.
      - name: Document depthai-sys (docs.rs)
        env:
          # Keep this strict, but allow the known autocxx-generated lint noise.
          RUSTDOCFLAGS: -D warnings -A unsafe-op-in-unsafe-fn
        run: cargo docs-rs -p depthai-sys

      - name: Document depthai (docs.rs)
        env:
          RUSTDOCFLAGS: -D warnings -A unsafe-op-in-unsafe-fn
        run: cargo docs-rs -p depthai
